name: CI

# 中身は tinayrum/.github の再利用ワークフロー（reusable-ci.yml）にある。CI を変えるときはそちらを変更する。
on:
  pull_request:
    branches: [main, develop]
    # edited: PR タイトルやマージ先（base）を変更したときにも再検査する
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  ci:
    uses: tinayrum/.github/.github/workflows/reusable-ci.yml@main
    with:
      python-version: "3.12"

  # 実装言語のテストを追加したら、ここに job を足す（例: pytest）。
