name: Check Branch Naming

# 中身は tinayrum/.github の再利用ワークフロー（reusable-check-branch.yml）にある。
on:
  pull_request:
    # edited: マージ先（base）を変更したときにも再検査する
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check:
    uses: tinayrum/.github/.github/workflows/reusable-check-branch.yml@main
    with:
      strategy: main-develop # main = リリース / develop = ステージング
