name: Release Drafter

# 中身は tinayrum/.github の再利用ワークフロー（reusable-release-drafter.yml）にある。GITHUB_TOKEN で動く。
on:
  push:
    branches: [main]

permissions:
  contents: write  # リリース・タグの作成
  pull-requests: read

jobs:
  release:
    uses: tinayrum/.github/.github/workflows/reusable-release-drafter.yml@main
    with:
      publish: true # main へのマージでリリースを公開する（false にすると下書き保存）
