# ブランチ名に応じたラベル付与ルール

main:
  - head-branch: "main"

develop:
  - head-branch: "develop"

feature:
  - head-branch: ['^feature/', '^feat/']

bugfix:
  - head-branch: ['^bugfix/', '^fix/']

hotfix:
  - head-branch: ['^hotfix/', '^hf/']

release:
  - head-branch: ['^release/', '^rel/']

# docs/ の変更では付けない。Docs as Code で docs も直す feature・bugfix の PR に付くと、
# リリースノートで「New Features」と「Documentation」の両方に同じ PR が出るため
docs:
  - head-branch: ['^docs/', '^doc/']

chore:
  - head-branch: ['^chore/', '^ch/']